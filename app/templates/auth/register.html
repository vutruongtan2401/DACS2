{% extends 'base.html' %}

{% block body_class %}auth-body-bg{% endblock %}

{% block content %}
<div class="auth-wrapper min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5 col-xl-4">
        <!-- Register Card Modal (Image 5) -->
        <div class="card border-0 shadow-lg rounded-5 bg-white p-4 p-md-5 auth-card-modal">
          <div class="text-center mb-4">
            <h3 class="fw-bold text-dark mb-1">Tạo tài khoản mới 🎉</h3>
            <p class="text-muted small mb-0">Tham gia cùng chúng tôi để khám phá thế giới</p>
          </div>

          <div id="authAlert" class="alert d-none rounded-3" role="alert"></div>

          <form id="registerForm" class="vstack gap-3">
            <div>
              <label class="form-label fw-semibold text-dark small mb-1">Họ và tên</label>
              <input type="text" class="form-control rounded-3 fs-6" name="full_name" placeholder="Nhập họ và tên" required>
            </div>

            <div>
              <label class="form-label fw-semibold text-dark small mb-1">Email</label>
              <input type="email" class="form-control rounded-3 fs-6" name="email" placeholder="Nhập email của bạn" required>
            </div>

            <div>
              <label class="form-label fw-semibold text-dark small mb-1">Mật khẩu</label>
              <div class="input-group">
                <input type="password" class="form-control rounded-start-3 fs-6 border-end-0" name="password" id="registerPassword" placeholder="Nhập mật khẩu" required>
                <button class="btn btn-outline-secondary border-start-0 rounded-end-3 text-muted toggle-password" type="button" data-target="registerPassword">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div>
              <label class="form-label fw-semibold text-dark small mb-1">Xác nhận mật khẩu</label>
              <div class="input-group">
                <input type="password" class="form-control rounded-start-3 fs-6 border-end-0" name="confirm_password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                <button class="btn btn-outline-secondary border-start-0 rounded-end-3 text-muted toggle-password" type="button" data-target="confirmPassword">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="form-check my-1">
              <input class="form-check-input" type="checkbox" id="termsCheck" required>
              <label class="form-check-label small text-muted" for="termsCheck">
                Tôi đồng ý với <a href="#" class="text-primary text-decoration-none">Điều khoản</a> và <a href="#" class="text-primary text-decoration-none">Chính sách bảo mật</a>
              </label>
            </div>

            <button class="btn btn-primary-gradient btn-lg w-100 rounded-3 fw-bold text-white shadow-sm" type="submit">
              <span class="btn-label">Đăng ký</span>
              <span class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true"></span>
            </button>

            <!-- Divider -->
            <div class="d-flex align-items-center my-1">
              <hr class="flex-grow-1 text-muted">
              <span class="px-3 text-muted small">hoặc</span>
              <hr class="flex-grow-1 text-muted">
            </div>

            <!-- Google Register Button -->
            <button type="button" class="btn btn-google-auth w-100 rounded-3 border py-2 fw-medium d-flex align-items-center justify-content-center gap-2">
              <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.4-1.57-5.12-3.74L.97 13.04C2.45 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.88 10.78A5.54 5.54 0 0 1 3.58 9c0-.62.11-1.22.3-1.78L.97 4.96A9.008 9.008 0 0 0 0 9c0 1.45.35 2.82.97 4.04l2.91-2.26z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.02.97 4.96l2.91 2.26C4.6 5.05 6.62 3.58 9 3.58z"/></svg>
              <span>Đăng ký với Google</span>
            </button>
          </form>

          <div class="text-center mt-3">
            <span class="small text-muted">Đã có tài khoản? </span>
            <a href="/auth/login" class="small text-primary text-decoration-none fw-bold">Đăng nhập ngay</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/auth.js"></script>
{% endblock %}
