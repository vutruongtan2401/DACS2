[alembic]
script_location = alembic
sqlalchemy.url = mssql+pyodbc:///?odbc_connect=DRIVER%3D%7BODBC+Driver+17+for+SQL+Server%7D%3BSERVER%3Dnp%3A%5C%5C.%5Cpipe%5CMSSQL%24SQLEXPRESS%5Csql%5Cquery%3BDATABASE%3DTravelPlanner%3BTrusted_Connection%3Dyes%3BEncrypt%3Dno%3BTrustServerCertificate%3Dyes%3B

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
